<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الماسح الذكي لتحضيرات التحاليل الطبية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    
    <!-- الربط مع ملف التحاليل الإضافية التخصصية DotCare -->
    <script src="dotcare.js"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #0d5c58 0%, #063836 100%);
            --primary: #00bfa5;
            --accent: #f59e0b;
            --card-bg: #114b48;
            --text-main: #ffffff;
            --text-sub: #b2dfdb;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Cairo', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px 15px 80px;
            position: relative;
        }

        .container { max-width: 550px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 22px; }
        header h1 { font-size: 1.35rem; font-weight: 800; margin-bottom: 5px; }
        header p { font-size: 0.85rem; color: var(--text-sub); }

        .controls-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .gender-options { display: flex; gap: 20px; margin-bottom: 16px; align-items: center; }
        .gender-options label { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer; }

        .upload-area { display: flex; flex-direction: column; gap: 10px; }
        .btn-action {
            background-color: var(--primary);
            color: #00332c;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            display: block;
            width: 100%;
            transition: 0.2s;
        }
        .btn-action:hover { opacity: 0.92; }

        input[type="file"] { display: none; }

        #previewContainer { display: none; margin-top: 15px; text-align: center; }
        #imagePreview { max-width: 100%; max-height: 240px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.2); }

        .rotate-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
        }

        .btn-sub {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 25, 30, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-card {
            background: rgba(12, 30, 38, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px 30px;
            border-radius: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 48px; height: 48px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .results-section { margin-top: 20px; display: none; }
        .results-section h3 { font-size: 1.1rem; margin-bottom: 12px; color: var(--accent); }

        .source-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-sub);
            font-weight: 700;
        }

        .test-result-card {
            background: #ffffff;
            color: #263238;
            border-radius: 12px;
            padding: 15px 18px;
            margin-bottom: 12px;
            border-right: 6px solid var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            user-select: text;
        }

        .test-result-card.warning-female { border-right-color: #e91e63; }
        .test-result-card h4 { color: #00796b; font-size: 1rem; margin-bottom: 6px; }
        .test-result-card p { font-size: 0.88rem; line-height: 1.6; }

        .alert-box {
            background: #ffebee;
            color: #c2185b;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 700;
            margin-top: 8px;
            font-size: 0.82rem;
            display: inline-block;
        }

        footer {
            margin-top: 35px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 15px;
            font-size: 0.82rem;
            color: var(--text-sub);
        }

        footer a { color: var(--primary); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>الماسح الذكي لتحضيرات التحاليل</h1>
        <p>فحص مباشر عبر معايير DotCare مدعوماً بالذكاء الاصطناعي</p>
    </header>

    <div class="controls-card">
        <div class="gender-options">
            <span style="font-weight:700; font-size:0.92rem;">نوع الحالة:</span>
            <label><input type="radio" name="gender" value="أنثى" checked> أنثى (Female)</label>
            <label><input type="radio" name="gender" value="ذكر"> ذكر (Male)</label>
        </div>

        <div class="upload-area">
            <label for="cameraInput" class="btn-action">📸 فتح الكاميرا وتصوير الروشتة</label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleImageInput(this)">

            <label for="fileInput" class="btn-action" style="background-color: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.3);">📁 اختيار صورة من المعرض</label>
            <input type="file" id="fileInput" accept="image/*" onchange="handleImageInput(this)">
        </div>

        <div id="previewContainer">
            <img id="imagePreview" alt="معاينة الروشتة">
            <div class="rotate-bar">
                <button class="btn-sub" onclick="rotateManual(-90)">🔄 تدوير يسار</button>
                <button class="btn-sub" onclick="rotateManual(90)">🔄 تدوير يمين</button>
                <button class="btn-sub" style="background: var(--accent);" onclick="reprocessCurrentScan()">🔍 إعادة الفحص</button>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <h3>جاري الفحص...</h3>
            <p id="loadingMsg" style="font-size: 0.85rem; color: #b2dfdb;">تحليل الروشتة ومطابقة شروط DotCare...</p>
        </div>
    </div>

    <div class="results-section" id="resultsSection">
        <div id="scanModeBadge" class="source-badge"></div>
        <h3>التحاليل المكتشفة وشروط التحضير:</h3>
        <div id="resultsList"></div>
    </div>

    <footer>
        <p>© جميع الحقوق محفوظة | تطوير: <a href="https://nourhan-salah.github.io/nour-portfolio/" target="_blank">نورهان صلاح (Nourhan Salah)</a></p>
    </footer>
</div>

<canvas id="procCanvas" style="display:none;"></canvas>

<script>
    // مفتاح API الآمن المعتمد في الويب[span_5](start_span)[span_5](end_span)
    const _kPart1 = "QVEuQWI4Uk42STFPTkh4";
    const _kPart2 = "Y3JRUm8xMkowLTlNUVBM";
    const _kPart3 = "bm5vSTluZXhNTEhhckJY";
    const _kPart4 = "anl3aTdrd0E=";
    const getSecureKey = () => atob(_kPart1 + _kPart2 + _kPart3 + _kPart4);

    let rawImg = new Image();
    let currentAngle = 0;
    let lastLoadedFile = null;

    // دمج قواعد التحاليل الأساسية مع ملف dotcare.js[span_6](start_span)[span_6](end_span)[span_7](start_span)[span_7](end_span)
    const primaryCommonRules = [
        {
            name: "فيتامين د (Vitamin D / 25-OH) [204108]",
            test: (t) => /vitamin\s*d|vit\s*d|v\.d|25[-_ ]?oh|204108/i.test(t),
            getNotes: (isFemale) => isFemale 
                ? `سيرم دم لا يحتاج إلى صيام.<br><span class="alert-box">⚠️ تنبيه خاص بالحالة (أنثى): لا يتم السحب أثناء فترة الدورة الشهرية (البريود)، ويتم السحب بعد الانتهاء منها بـ 48 ساعة.</span>`
                : `سيرم دم لا يحتاج إلى صيام، مع تجنب تناول جرعات مكثفة من فيتامين د قبل الفحص بيومين.`
        },
        {
            name: "صورة دم كاملة (COMPLETE BLOOD PICTURE - CBC) [2090001]",
            test: (t) => /\bcbc\b|complete\s*blood\s*count|blood\s*picture|2090001/i.test(t),
            getNotes: () => `دم كامل على أنبوبة EDTA، لا يشترط الصيام، مع خلط الأنبوبة بلطف فور السحب.`
        },
        {
            name: "سكر صائم بالدم (FASTING BLOOD SUGAR - FBS) [2040001]",
            test: (t) => /fasting\s*blood\s*sugar|\bfbs\b|2040001/i.test(t),
            getNotes: () => `صيام من 6 إلى 8 ساعات (يسمح بشرب الماء فقط). تسحب العينة على أنبوبة فلوريد صوديوم لتثبيط تحلل الجلوكوز.`
        }
    ];

    const medicalRules = [
        ...primaryCommonRules,
        ...(typeof DOTCARE_EXTRA_TESTS !== 'undefined' ? DOTCARE_EXTRA_TESTS : [])
    ];

    function handleImageInput(input) {
        if (!input.files || !input.files[0]) return;
        lastLoadedFile = input.files[0];
        processAndScanFile(lastLoadedFile);
    }

    async function processAndScanFile(file) {
        const overlay = document.getElementById('loadingOverlay');
        const msg = document.getElementById('loadingMsg');
        overlay.style.display = 'flex';
        msg.innerText = "✂️ معالجة وقص الصورة وتحسين التباين...";

        try {
            // استخدام دالة المعالجة المسبقة للويب لقص السواد وتعديل الصورة[span_8](start_span)[span_8](end_span)
            const base64Processed = await preprocessMedicalImage(file);
            rawImg.src = base64Processed;
            rawImg.onload = async () => {
                currentAngle = 0;
                applyCanvasTransform();
                document.getElementById('previewContainer').style.display = 'block';
                await executeAIGeminiScan(base64Processed.split(',')[1]);
                overlay.style.display = 'none';
            };
        } catch (e) {
            console.error(e);
            overlay.style.display = 'none';
            alert("حدث خطأ أثناء معالجة الصورة.");
        }
    }

    function rotateManual(deg) {
        currentAngle = (currentAngle + deg) % 360;
        applyCanvasTransform();
    }

    function reprocessCurrentScan() {
        if (lastLoadedFile) {
            processAndScanFile(lastLoadedFile);
        }
    }

    function applyCanvasTransform() {
        const cvs = document.getElementById('procCanvas');
        const ctx = cvs.getContext('2d');
        const rad = (currentAngle * Math.PI) / 180;

        if (Math.abs(currentAngle) === 90 || Math.abs(currentAngle) === 270) {
            cvs.width = rawImg.height;
            cvs.height = rawImg.width;
        } else {
            cvs.width = rawImg.width;
            cvs.height = rawImg.height;
        }

        ctx.clearRect(0, 0, cvs.width, cvs.height);
        ctx.save();
        ctx.translate(cvs.width / 2, cvs.height / 2);
        ctx.rotate(rad);
        ctx.drawImage(rawImg, -rawImg.width / 2, -rawImg.height / 2);
        ctx.restore();

        document.getElementById('imagePreview').src = cvs.toDataURL();
    }

    // المعالجة المسبقة للصور تماماً كما في نسخة الويب[span_9](start_span)[span_9](end_span)
    async function preprocessMedicalImage(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;

                    let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;
                    let foundPaper = false;

                    for (let y = 0; y < canvas.height; y += 3) {
                        for (let x = 0; x < canvas.width; x += 3) {
                            const i = (y * canvas.width + x) * 4;
                            const brightness = (data[i] + data[i + 1] + data[i + 2]) / 3;
                            if (brightness > 55) {
                                if (x < minX) minX = x;
                                if (x > maxX) maxX = x;
                                if (y < minY) minY = y;
                                if (y > maxY) maxY = y;
                                foundPaper = true;
                            }
                        }
                    }

                    if (!foundPaper || maxX - minX < 60 || maxY - minY < 60) {
                        minX = 0; minY = 0; maxX = canvas.width; maxY = canvas.height;
                    }

                    const pad = 12;
                    minX = Math.max(0, minX - pad);
                    minY = Math.max(0, minY - pad);
                    const cropW = Math.min(canvas.width - minX, (maxX - minX) + pad * 2);
                    const cropH = Math.min(canvas.height - minY, (maxY - minY) + pad * 2);

                    const finalCanvas = document.createElement('canvas');
                    finalCanvas.width = cropW;
                    finalCanvas.height = cropH;
                    const fCtx = finalCanvas.getContext('2d');
                    fCtx.drawImage(canvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

                    resolve(finalCanvas.toDataURL('image/jpeg', 0.95));
                };
                img.onerror = reject;
            };
        });
    }

    // محرك الفحص الذكي المطابق للويب[span_10](start_span)[span_10](end_span)
    async function executeAIGeminiScan(base64Data) {
        const msg = document.getElementById('loadingMsg');
        msg.innerText = "🔍 جاري قراءة أسماء واختصارات التحاليل بخط اليد عبر Gemini...";
        const isFemale = document.querySelector('input[name="gender"]:checked').value === 'أنثى';

        const promptText = `
أنت خبير في قراءة الروشتات الطبية والفحوصات المعملية (سواء خط يد أو طباعة سيستم).
استخرج كافة التحاليل الطبية المكتوبة بدقة تامة (مثل: CBC, FBS, 2H PP, TSH, Vit D, SGPT, Urea، وغيرها).
أخرج النتيجة بصيغة JSON Array نقية فقط دون أي شروحات:
[
  {
    "raw_name": "اسم التحليل بالإنجليزية",
    "fallback_instructions": "شروط مختصرة"
  }
]`;

        try {
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${getSecureKey()}`;
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: promptText },
                            { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                        ]
                    }],
                    generationConfig: { response_mime_type: "application/json", temperature: 0.1 }
                })
            });

            const data = await response.json();
            if (response.ok && data.candidates && data.candidates[0].content) {
                let text = data.candidates[0].content.parts[0].text;
                text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                const detectedTests = JSON.parse(text);

                if (Array.isArray(detectedTests) && detectedTests.length > 0) {
                    const finalResults = [];
                    detectedTests.forEach(item => {
                        const queryText = item.raw_name.trim();
                        const dotCareMatch = medicalRules.find(rule => rule.test(queryText));

                        if (dotCareMatch) {
                            finalResults.push({
                                test_name: dotCareMatch.name,
                                instructions: typeof dotCareMatch.getNotes === 'function' ? dotCareMatch.getNotes(isFemale) : "لا توجد شروط خاصة.",
                                is_critical_female: dotCareMatch.name.includes("Vitamin D") && isFemale
                            });
                        } else {
                            finalResults.push({
                                test_name: queryText,
                                instructions: "لا توجد شروط تحضير خاصة مسجلة لهذا التحليل (عينة دم أو بول عادية لا تتطلب صياماً ما لم يطلب الطبيب المعالج خلاف ذلك).",
                                is_critical_female: /vitamin\s*d|25-oh/i.test(queryText) && isFemale
                            });
                        }
                    });
                    displayResults(finalResults, "✨ تم التعرف عبر Gemini ومطابقة الشروط من بنك DotCare");
                    return;
                }
            }
            throw new Error("Empty AI response");
        } catch (err) {
            console.warn("AI scan failed, falling back to local OCR:", err);
            await runLocalTesseractFallback(isFemale);
        }
    }

    // الماسح الاحتياطي المحلي في حال انقطاع الإنترنت[span_11](start_span)[span_11](end_span)
    async function runLocalTesseractFallback(isFemale) {
        const cvs = document.getElementById('procCanvas');
        try {
            const result = await Tesseract.recognize(cvs, 'eng+ara');
            const extractedText = result.data.text;
            const matched = medicalRules.filter(rule => rule.test(extractedText));

            const formatted = matched.map(item => ({
                test_name: item.name,
                instructions: typeof item.getNotes === 'function' ? item.getNotes(isFemale) : "لا توجد شروط خاصة.",
                is_critical_female: item.name.includes("Vitamin D") && isFemale
            }));

            displayResults(formatted, "🛡️ تم الفحص عبر المحرك المحلي الاحتياطي وقاعدة DotCare");
        } catch (e) {
            displayResults([], "تعذر قراءة الصورة، يرجى التأكد من وضوح الإضاءة.");
        }
    }

    function displayResults(tests, badgeText) {
        const badge = document.getElementById('scanModeBadge');
        const listDiv = document.getElementById('resultsList');
        const sec = document.getElementById('resultsSection');

        badge.innerText = badgeText;
        listDiv.innerHTML = '';

        if (!Array.isArray(tests) || tests.length === 0) {
            listDiv.innerHTML = '<div class="test-result-card"><p>لم يتم العثور على تحاليل مطابقة، يرجى تدوير الصورة أو تصويرها بوضوح.</p></div>';
        } else {
            tests.forEach(item => {
                const card = document.createElement('div');
                card.className = `test-result-card ${item.is_critical_female ? 'warning-female' : ''}`;
                card.innerHTML = `
                    <h4>📋 ${item.test_name}</h4>
                    <p>${item.instructions}</p>
                    ${item.is_critical_female ? '<div class="alert-box">⚠️ تنبيه خاص بالحالة (أنثى): مراعاة موعد الدورة الشهرية (السحب بعدها بـ 48 ساعة)</div>' : ''}
                `;
                listDiv.appendChild(card);
            });
        }
        sec.style.display = 'block';
        sec.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
